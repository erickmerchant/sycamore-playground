[package]
name = "sycamore-playground"
version = "0.1.0"
edition = "2024"

[dependencies]
custom-element = "0.1.5"
js-sys = "0.3.106"
sycamore = "0.9.4"
wasm-bindgen = "0.2.129"
web-sys = {version = "0.3.106", features = ["Window","Document","HtmlElement","Node","Text", "CustomElementRegistry", "ShadowRoot", "ShadowRootMode", "ShadowRootInit",]}

[profile.release]
panic = 'abort'
codegen-units = 1
opt-level = 'z'
lto = true
